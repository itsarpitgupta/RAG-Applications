[project]
name = "project-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arpit Kumar", email = "itsarpitgupta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
project-2 = "project_2:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
