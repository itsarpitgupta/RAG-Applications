app:
  name: "Incremental RAG System"
  version: "1.0.0"

storage:
  raw_docs_dir: "storage/raw_docs"
  faiss_index_dir: "storage/faiss_index"
  db_path: "storage/app.db"

scheduler:
  enabled: true
  mode: "interval"
  interval_hours: 1
  max_batch_size: 50
  max_retries: 3

chunking:
  chunk_size: 512
  chunk_overlap: 64
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "
    - ""

embeddings:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"  # Or "BAAI/bge-small-en-v1.5"
  device: "cpu"
  normalize: true

vectorstore:
  type: "faiss"
  metric: "inner_product"   # Normalized cosine similarity
  index_file: "index.bin"
  meta_file: "index_meta.json"

llm:
  provider: "grok"
  api_key_env: "GROK_API_KEY"
  base_url: "https://api.x.ai/v1"
  model: "grok-beta"
  temperature: 0.1
  max_tokens: 1024
  top_k_retrieval: 4
